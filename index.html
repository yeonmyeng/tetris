<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 완성형</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }

    .container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .board-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    canvas {
      background: #111827;
      border: 2px solid #334155;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      transition: transform 0.08s ease;
      display: block;
    }

    .side {
      width: 280px;
      max-width: 100%;
    }

    .panel {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(6px);
    }

    .panel h2,
    .panel h3 {
      margin: 0 0 12px 0;
    }

    .stats div {
      margin-bottom: 8px;
      font-size: 16px;
    }

    .mini-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .next-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .next-list canvas {
      width: 120px;
      height: 120px;
    }

    button, select {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    select {
      padding: 0 8px;
      color: #111827;
      background: white;
    }

    .hint {
      color: #cbd5e1;
      font-size: 13px;
      min-height: 18px;
      margin-top: 8px;
      text-align: center;
    }

    .keys {
      line-height: 1.8;
      font-size: 14px;
      color: #e2e8f0;
    }

    .status-strong {
      color: #fbbf24;
      font-weight: bold;
    }

    .status-danger {
      color: #f87171;
      font-weight: bold;
    }

    .floating-message {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.14);
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
      white-space: nowrap;
    }

    .floating-message.show {
      opacity: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      z-index: 10;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-card {
      width: 80%;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }

    .overlay-title {
      font-size: 32px;
      font-weight: bold;
      color: #f87171;
      margin-bottom: 12px;
    }

    .overlay-score {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .overlay button {
      margin-top: 0;
    }

    .combo-badge {
      margin-top: 8px;
      font-size: 14px;
      color: #93c5fd;
      min-height: 18px;
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .container {
        gap: 16px;
      }

      .side {
        width: 100%;
        max-width: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="board-wrap">
      <div id="floatingMessage" class="floating-message"></div>
      <canvas id="board"></canvas>

      <div id="gameOverScreen" class="overlay">
        <div class="overlay-card">
          <div class="overlay-title">GAME OVER</div>
          <div class="overlay-score">점수: <span id="finalScore">0</span></div>
          <div class="overlay-score">최고 점수: <span id="finalBestScore">0</span></div>
          <button id="restartBtn">다시 시작</button>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h2>테트리스</h2>
        <div class="stats">
          <div>점수: <span id="score">0</span></div>
          <div>최고 점수: <span id="bestScore">0</span></div>
          <div>라인: <span id="lines">0</span></div>
          <div>레벨: <span id="level">1</span></div>
          <div>상태: <span id="status">대기</span></div>
          <div class="combo-badge" id="comboText"></div>
        </div>
      </div>

      <div class="panel">
        <h3>다음 블록</h3>
        <div class="next-list">
          <canvas id="next1" width="120" height="120"></canvas>
          <canvas id="next2" width="120" height="120"></canvas>
          <canvas id="next3" width="120" height="120"></canvas>
        </div>
        <div id="nextHint" class="hint"></div>
      </div>

      <div class="panel">
        <h3>홀드</h3>
        <div class="mini-wrap">
          <canvas id="hold" width="120" height="120"></canvas>
        </div>
        <div id="holdHint" class="hint"></div>
      </div>

      <div class="panel">
        <select id="difficulty">
          <option value="normal">보통</option>
          <option value="hard">어려움</option>
          <option value="insane">지옥</option>
        </select>

        <button id="startBtn">시작</button>
        <button id="pauseBtn">일시정지</button>
        <button id="resetBtn">리셋</button>
      </div>

      <div class="panel">
        <h3>조작 방법</h3>
        <div class="keys">
          ← / → : 좌우 이동<br>
          ↑ : 회전<br>
          ↓ : 소프트 드롭<br>
          Space : 하드 드롭<br>
          C 또는 Shift : 홀드
        </div>
      </div>
    </div>
  </div>

  <script src="tetris.js" defer></script>
</body>
</html>
